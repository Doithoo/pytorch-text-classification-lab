name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to publish
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      # The main CI checks the supported Python 3.10 target. Release runs on 3.12.
      - run: uv run mypy --python-version 3.12
      - run: uv run pytest -W error::DeprecationWarning
      - run: uv build
      - run: uv run twine check dist/*
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
