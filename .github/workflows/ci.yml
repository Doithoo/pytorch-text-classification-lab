name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
        if: matrix.python-version == '3.10'
      - run: uv run pre-commit run --all-files
        if: matrix.python-version == '3.10'
      - run: uv run pytest -W error::DeprecationWarning
      - run: uv run mkdocs build --strict
        if: matrix.python-version == '3.10'
      - run: |
          uv run text-classify --version
          uv run text-classify list-models
          uv run text-classify show-config --config configs/learning_minimal.yaml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv build
      - run: uv run twine check dist/*
      - run: uv venv --python 3.12 /tmp/text-classification-wheel-smoke
      - run: uv pip install --python /tmp/text-classification-wheel-smoke/bin/python dist/*.whl
      - run: |
          /tmp/text-classification-wheel-smoke/bin/text-classify --version
          /tmp/text-classification-wheel-smoke/bin/text-classify list-models
